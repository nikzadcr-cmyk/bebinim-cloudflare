name: Backend Deploy (Cloudflare Workers)

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-deploy.yml'
  workflow_dispatch:

concurrency:
  group: backend-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Graceful skip when the token isn't configured yet — add it once in
      # repo Settings → Secrets and variables → Actions → New repository secret:
      #   Name: CLOUDFLARE_API_TOKEN
      #   Value: a Cloudflare API token with "Workers Scripts:Edit" permission
      - name: Guard — require CLOUDFLARE_API_TOKEN
        id: guard
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CF_TOKEN" ]; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "::warning::CLOUDFLARE_API_TOKEN secret is not set — backend was NOT deployed. Add it in Settings → Secrets → Actions (Workers Scripts:Edit permission) to enable auto-deploy."
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Typecheck
        if: steps.guard.outputs.deploy == 'true'
        run: |
          cd backend
          npm install --no-audit --no-fund
          npx tsc --noEmit

      - name: Deploy worker
        if: steps.guard.outputs.deploy == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: a47c4851daa6d1165a88f2f68ac093f3
          workingDirectory: backend
          command: deploy
